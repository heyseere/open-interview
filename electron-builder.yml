appId: com.heyseere.open-interview
productName: Open Interview
compression: maximum # 发行包最大压缩（安装包更小，仅增加构建时间）
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.{md,map}'
  - '!**/*.d.ts'
  - '!**/{test,__tests__,tests,example,examples,docs}/**'
  - '!**/{.github,.idea,*.tsbuildinfo}'
  - '!scripts'
  - '!{vitest.config.ts,components.json,.serena,.zcode,AGENTS.md}'
win:
  executableName: open-interview
  # No bundled local-ASR engine: the app installs whisper.cpp through winget on
  # first use (falling back to the official prebuilt release zip), so the
  # installer carries no multi-megabyte binary of its own.
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  artifactName: ${name}-${version}-${arch}-mac.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  # No bundled local-ASR engine: `brew install whisper.cpp` provides
  # whisper-server on first use (see src/main/whisper-server.ts).
  electronLanguages:
    - zh-CN
    - en
  publish: null # 关闭 macOS 自动更新功能
  extendInfo:
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: heyseere
  repo: open-interview
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
# Harden the packaged binary (no effect in dev): with runAsNode off the app
# cannot be run as plain Node (ELECTRON_RUN_AS_NODE=1), and with the inspect
# fuses off it cannot be attached via --inspect / NODE_OPTIONS — either would
# bypass the renderer IPC allowlist and reach the encrypted key store.
# --remote-debugging-port (the CDP verification loop) is a Chromium switch and
# stays available. process.fork is unused, so runAsNode: false is safe.
# resetAdHocDarwinSignature: flipping fuses rewrites the main binary, which
# invalidates the ad-hoc signature Electron ships with — without the reset the
# arm64 macOS app is SIGKILLed at launch (Apple Silicon refuses binaries whose
# signature does not match their bytes).
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  resetAdHocDarwinSignature: true
