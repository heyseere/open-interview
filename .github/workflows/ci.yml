name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

  # Packaging smoke test: catches runtime-only dependency errors (e.g. a
  # bundled library requiring a package that was dropped from package.json)
  # that typecheck and unit tests cannot see. Runs on macOS because the app
  # only ships for macOS and Windows.
  package-smoke:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (renderer + main)
        run: npx electron-vite build

      - name: Package (unsigned, directory only)
        run: npx electron-builder --mac --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke test the packaged app
        run: npm run smoke
        env:
          SMOKE_MS: '12000'
