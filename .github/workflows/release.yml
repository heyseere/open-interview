name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*' # Trigger only on version tags like v1.0.0

permissions:
  contents: write # required for creating releases & uploading assets

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Package Electron app
        run: npm run build:${{ matrix.os == 'windows-latest' && 'win' || 'mac' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned: skip keychain/timestamp probing

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: electron-build-${{ matrix.os }}
          path: dist/** # electron-builder output folder

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist

      - name: Create GitHub Release
        # Windows installers + latest-windows.yml are auto-published to the
        # same draft release by electron-builder itself (publish: github +
        # GH_TOKEN on a tag build). This job attaches the macOS artifacts
        # (publish: null on the mac target), so a tag yields ONE complete
        # draft. Re-uploading an asset with an existing name overwrites it,
        # which keeps the list idempotent either way.
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            dist/**/open-interview-*.dmg
            dist/**/open-interview-*.zip
            dist/**/open-interview-*.exe
            dist/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
